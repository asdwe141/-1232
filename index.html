<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>FIRE-CHECK | 실시간 QR 스캔</title>
<script defer src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#15314c;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#143554;color:white;font-size:18px;font-weight:750;padding:16px}header small{display:block;font-size:12px;color:#d4e6f6;margin-top:5px;font-weight:400}main{max-width:650px;margin:auto;padding:13px 12px 40px}.card{background:white;border:1px solid #dce6ef;border-radius:14px;padding:14px}h1{font-size:19px;margin:3px 0 9px}p{color:#5b7084;font-size:13px;line-height:1.55}.camera{background:#111d2a;border-radius:12px;position:relative;overflow:hidden;min-height:250px}.camera video{width:100%;height:auto;max-height:73vh;display:block;object-fit:contain}.guide{position:absolute;left:4%;right:4%;top:4%;bottom:4%;border:1px solid rgba(255,255,255,.18);border-radius:14px;pointer-events:none}.hint{position:absolute;bottom:10px;left:10px;right:10px;padding:7px;border-radius:7px;background:#081927ab;color:white;font-size:12px;text-align:center;pointer-events:none}#status{font-weight:700;line-height:1.5;margin:13px 0 6px}#diagnostic{font-size:12px;color:#785216;background:#fff6db;padding:10px;border-radius:9px;white-space:pre-wrap;display:none}#meta{color:#657b8f;font-size:12px;margin:8px 0}.row{display:flex;gap:8px;margin:12px 0}.row>*{flex:1}button,a.btn{border:0;border-radius:9px;background:#17619d;color:#fff;cursor:pointer;font-size:14px;font-weight:700;padding:12px;text-align:center;text-decoration:none}button.alt,a.btn.alt{background:#e7f1f8;color:#14496d}button:disabled{opacity:.5}.full{display:block;width:100%;margin:8px 0}.range{display:none}label{font-size:13px;font-weight:700;display:block;margin:13px 0 6px}input[type=range]{width:100%;accent-color:#196cad}input[type=url]{width:100%;font-size:14px;padding:11px;border-radius:8px;border:1px solid #b8cadb}.tiny{font-size:12px;color:#60748a}#torch{display:none}
</style>
</head>
<body><header>FIRE-CHECK<small>소화기·소화전 실시간 QR 스캔</small></header>
<main><section class="card"><h1>설비 QR 스캔</h1><p>QR코드를 비추면 인식된 설비 주소로 바로 이동합니다. FIRE-CHECK 버튼으로 열거나 이 페이지를 직접 열어도 됩니다.</p>
<div class="camera"><video id="camera" autoplay muted playsinline aria-label="QR 스캔 카메라"></video><div class="guide"></div><div class="hint">멀리서 잘 보이지 않으면 1.5~2배 확대해 보세요</div></div>
<div id="status" role="status" aria-live="polite">스캐너 준비 중…</div><div id="diagnostic" role="alert"></div><div id="meta">인식 방식 준비 중</div>
<div class="row"><button id="retry" type="button">카메라 다시 시작</button><button id="torch" class="alt" type="button">손전등 켜기</button></div>
<div class="range" id="zoomArea"><label for="zoom">카메라 확대 <span id="zoomText"></span></label><input type="range" id="zoom" min="1" max="3" step="0.1" value="1"></div>
<p class="tiny">카메라 확대를 지원하지 않는 기기도 있습니다. QR 인식 후 기존 FIRE-CHECK 설비 점검표로 이동합니다.</p>
<label for="manual">주소를 읽었는데 점검표로 이동하지 않을 때 (진단용)</label><input id="manual" type="url" placeholder="기본 카메라로 읽은 설비 URL 붙여넣기"><button id="manualGo" class="alt full">주소 확인</button>
<a id="back" class="btn alt full" hidden>FIRE-CHECK로 돌아가기</a>
</section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
// 연결 주소(return)는 편의 기능입니다. QR 자체에 포함된 배포 주소를 우선합니다.
let app=null;
try {
  const raw=params.get('return')||'';
  const candidate=new URL(raw);
  if(candidate.protocol==='https:' && candidate.hostname==='script.google.com' &&
     /^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(candidate.pathname)) app=candidate;
}catch(_){}
if(app){$('back').href=app.origin+app.pathname;$('back').hidden=false;}
let stream=null,reader=null,controls=null,detector=null,nativeTimer=null,started=false,navigating=false,torchOn=false,seen=0,begin=0;
const camera=$('camera');
function message(s,details=''){$('status').textContent=s;$('diagnostic').textContent=details;$('diagnostic').style.display=details?'block':'none';}
function accept(text){
 if(navigating)return;
 seen++;
 let u;
 try{u=new URL(String(text).trim());}
 catch(_){message('QR은 읽었지만 웹주소가 아닙니다.','FIRE-CHECK 설비 QR코드인지 확인해 주세요.');return;}
 // 외부 웹사이트로 임의 이동하지 않도록 Apps Script 정식 배포 경로만 허용합니다.
 if(u.protocol!=='https:' || u.hostname!=='script.google.com' ||
    !/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.pathname) ||
    u.username || u.password || u.port){
   message('QR 인식 성공 / FIRE-CHECK 주소가 아닙니다.',
      'Google Apps Script 정식 웹앱 주소(https://script.google.com/macros/s/.../exec)만 점검표로 열 수 있습니다.');return;
 }
 const eq=u.searchParams.get('eq')||'';
 if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(eq)){
   message('QR 인식 성공 / 설비 ID가 올바르지 않습니다.',
     '기존 설비 QR에 포함된 eq=설비고유ID 값을 확인하세요.');return;
 }
 // 스캐너 버튼에서 전달한 주소가 없거나 다르더라도 QR에 인쇄된 원래 배포 주소로 이동합니다.
 // 실수로 새 배포 주소를 만들었어도 기존 설비 라벨의 연결을 우선 보존합니다.
 navigating=true;message('설비 QR 인식 성공! 점검표로 이동합니다.');
 try{navigator.vibrate?.(80)}catch(_){}
 const target=new URL(u.origin+u.pathname);
 target.searchParams.set('eq',eq);
 stop();location.assign(target.href);
}
function setupTools(track){
 let c={};try{c=track.getCapabilities?.()||{}}catch(_){}
 $('torch').style.display=c.torch?'block':'none';torchOn=false;$('torch').textContent='손전등 켜기';
 if(c.zoom&&Number.isFinite(c.zoom.min)&&Number.isFinite(c.zoom.max)&&c.zoom.max>c.zoom.min){
  $('zoomArea').style.display='block';$('zoom').min=c.zoom.min;$('zoom').max=c.zoom.max;$('zoom').step=c.zoom.step||0.1;
  $('zoom').value=Math.max(c.zoom.min,Math.min(c.zoom.max,1));$('zoomText').textContent=Number($('zoom').value).toFixed(1)+'×';
 }else $('zoomArea').style.display='none';
}
async function stop(){started=false;clearTimeout(nativeTimer);nativeTimer=null;
 if(controls){try{controls.stop()}catch(_){}controls=null;}
 reader=null;detector=null;
 if(stream){for(const t of stream.getTracks())t.stop();stream=null;}
 camera.pause();camera.srcObject=null;
}
async function start(){if(started)return;started=true;navigating=false;begin=performance.now();seen=0;
 $('retry').disabled=true;message('후면 카메라 시작 중…');
 try{
  if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 카메라 접근을 지원하는 브라우저가 필요합니다.');
  // A single camera stream is shared by both decoders: no competing cameras and no center-only ROI.
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}});
  camera.srcObject=stream;await camera.play();
  const track=stream.getVideoTracks()[0];setupTools(track);
  try{const cap=track.getCapabilities?.()||{};if(cap.focusMode?.includes('continuous'))await track.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(_){}
  let engines=[];
  if('BarcodeDetector' in window){try{const fmt=await BarcodeDetector.getSupportedFormats();if(fmt.includes('qr_code')){detector=new BarcodeDetector({formats:['qr_code']});engines.push('기기 기본 인식');}}catch(_){}}
  if(window.ZXingBrowser?.BrowserQRCodeReader){
   reader=new ZXingBrowser.BrowserQRCodeReader(250);
   try{controls=await reader.decodeFromVideoElement(camera,(result,error)=>{if(result?.getText)accept(result.getText());});engines.push('ZXing 각도 인식');}
   catch(e){reader=null;controls=null;}
  }
  if(!engines.length)throw Error('인식 라이브러리 불러오기에 실패했습니다. 인터넷 연결을 확인하세요.');
  $('meta').textContent='활성 인식 방식: '+engines.join(' + ')+' · 영상 전체 스캔';
  message('QR 스캔 중 — 화면 어느 위치에 비춰도 됩니다.');
  // Native recognizer is rate-limited; the ZXing QR reader runs continuously on the same video.
  if(detector){const tick=async()=>{
    if(!started||navigating)return;
    try{if(camera.readyState>=2){const results=await detector.detect(camera);if(results.length)accept(results[0].rawValue);}}catch(_){}
    if(started&&!navigating)nativeTimer=setTimeout(tick,650);
   };tick();}
 }catch(e){await stop();message('스캐너 실행 실패',e.message||String(e));}
 finally{$('retry').disabled=false;}
}
$('retry').addEventListener('click',async()=>{await stop();start();});
$('torch').addEventListener('click',async()=>{try{const v=!torchOn;await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:v}]});torchOn=v;$('torch').textContent=v?'손전등 끄기':'손전등 켜기';}catch(_){message('손전등 기능을 지원하지 않습니다.');}});
$('zoom').addEventListener('input',async(e)=>{const v=Number(e.target.value);$('zoomText').textContent=v.toFixed(1)+'×';try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:v}]});}catch(_){}});
$('manualGo').addEventListener('click',()=>{if($('manual').value.trim())accept($('manual').value.trim());});
window.addEventListener('pagehide',()=>{stop();});
window.addEventListener('load',()=>{if(!app){$('meta').textContent='연결 주소 없이 실행 중 — 설비 QR에 포함된 주소로 이동합니다.';}start();});
</script></body></html>
